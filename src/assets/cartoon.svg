<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <clipPath id="ctClip"><circle cx="100" cy="100" r="100" /></clipPath>
    <radialGradient id="ctShade" cx="34%" cy="28%" r="80%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.5" />
      <stop offset="65%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.2" />
    </radialGradient>
  </defs>

  <g clip-path="url(#ctClip)">
    <rect width="200" height="200" fill="#ffd93d" />

    <!-- blush -->
    <circle cx="48" cy="118" r="16" fill="#ff8fa3" fill-opacity="0.55" />
    <circle cx="152" cy="118" r="16" fill="#ff8fa3" fill-opacity="0.55" />

    <!-- eyes -->
    <ellipse cx="72" cy="80" rx="15" ry="19" fill="#ffffff" />
    <ellipse cx="128" cy="80" rx="15" ry="19" fill="#ffffff" />
    <circle cx="75" cy="83" r="8" fill="#22262e" />
    <circle cx="131" cy="83" r="8" fill="#22262e" />
    <circle cx="78" cy="79" r="3" fill="#ffffff" />
    <circle cx="134" cy="79" r="3" fill="#ffffff" />

    <!-- eyebrows -->
    <path d="M 58 56 Q 72 48 87 55" fill="none" stroke="#22262e" stroke-width="5" stroke-linecap="round" />
    <path d="M 113 55 Q 128 48 142 56" fill="none" stroke="#22262e" stroke-width="5" stroke-linecap="round" />

    <!-- grin -->
    <path d="M 62 120 Q 100 160 138 120 Z" fill="#22262e" />
    <path d="M 78 135 Q 100 146 122 135 Q 100 152 78 135 Z" fill="#ff6b81" />
  </g>

  <circle cx="100" cy="100" r="100" fill="url(#ctShade)" />
</svg>
