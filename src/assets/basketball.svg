<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="bbShade" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#ff9b52" />
      <stop offset="55%" stop-color="#e8712a" />
      <stop offset="100%" stop-color="#a8410f" />
    </radialGradient>
    <clipPath id="bbClip"><circle cx="100" cy="100" r="98" /></clipPath>
  </defs>

  <circle cx="100" cy="100" r="98" fill="url(#bbShade)" />

  <g clip-path="url(#bbClip)" fill="none" stroke="#2b1405" stroke-width="5" stroke-linecap="round">
    <!-- vertical and horizontal seams -->
    <line x1="100" y1="2" x2="100" y2="198" />
    <line x1="2" y1="100" x2="198" y2="100" />
    <!-- the two curved side seams -->
    <path d="M 22 18 Q 72 100 22 182" />
    <path d="M 178 18 Q 128 100 178 182" />
  </g>

  <circle cx="100" cy="100" r="98" fill="none" stroke="#000000" stroke-opacity="0.35" stroke-width="2" />
</svg>
