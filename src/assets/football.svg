<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="fbShade" cx="34%" cy="28%" r="80%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="62%" stop-color="#eef1f5" />
      <stop offset="100%" stop-color="#aeb5c0" />
    </radialGradient>
    <clipPath id="fbClip"><circle cx="100" cy="100" r="98" /></clipPath>
  </defs>

  <circle cx="100" cy="100" r="98" fill="url(#fbShade)" />

  <!-- Truncated-icosahedron layout: one pentagon at the centre, five around it,
       each rotated so a vertex points outward. Clipped by the ball edge. -->
  <g clip-path="url(#fbClip)" fill="#15171c">
    <polygon points="100,64 134.2,88.9 121.2,129.1 78.8,129.1 65.8,88.9" />
    <polygon points="100,-2 128.5,18.7 117.6,52.3 82.4,52.3 71.5,18.7" />
    <polygon points="197,68.5 186.1,102.1 150.9,102.1 140,68.5 168.5,47.8" />
    <polygon points="159.9,182.5 124.7,182.5 113.8,148.9 142.3,128.2 170.8,148.9" />
    <polygon points="40.1,182.5 29.2,148.9 57.7,128.2 86.2,148.9 75.3,182.5" />
    <polygon points="3,68.5 31.5,47.8 60,68.5 49.1,102.1 13.9,102.1" />
  </g>

  <!-- Seams joining the centre pentagon to its neighbours -->
  <g clip-path="url(#fbClip)" fill="none" stroke="#15171c" stroke-width="4" stroke-opacity="0.85">
    <line x1="100" y1="64" x2="100" y2="52.3" />
    <line x1="134.2" y1="88.9" x2="150.9" y2="102.1" />
    <line x1="121.2" y1="129.1" x2="113.8" y2="148.9" />
    <line x1="78.8" y1="129.1" x2="86.2" y2="148.9" />
    <line x1="65.8" y1="88.9" x2="49.1" y2="102.1" />
  </g>

  <circle cx="100" cy="100" r="98" fill="none" stroke="#000000" stroke-opacity="0.35" stroke-width="2" />
</svg>
