<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="vbShade" cx="34%" cy="28%" r="80%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45" />
      <stop offset="62%" stop-color="#ffffff" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.3" />
    </radialGradient>
    <clipPath id="vbClip"><circle cx="100" cy="100" r="98" /></clipPath>
  </defs>

  <!--
    Front view of an indoor match ball: the panel seams run pole to pole, so
    from here the ball reads as curved vertical bands. Yellow at the edges,
    blue inside, white through the middle.
  -->
  <g clip-path="url(#vbClip)">
    <circle cx="100" cy="100" r="98" fill="#f4b81c" />

    <path d="M 58 0 C 36 60, 36 140, 58 200 L 142 200 C 164 140, 164 60, 142 0 Z" fill="#1f4fa8" />

    <path d="M 78 0 C 60 58, 60 142, 78 200 L 122 200 C 140 142, 140 58, 122 0 Z" fill="#f8fafc" />
  </g>

  <g clip-path="url(#vbClip)" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round">
    <path d="M 58 0 C 36 60, 36 140, 58 200" />
    <path d="M 78 0 C 60 58, 60 142, 78 200" />
    <path d="M 122 0 C 140 58, 140 142, 122 200" />
    <path d="M 142 0 C 164 60, 164 140, 142 200" />
  </g>

  <circle cx="100" cy="100" r="98" fill="url(#vbShade)" />
  <circle cx="100" cy="100" r="98" fill="none" stroke="#000000" stroke-opacity="0.3" stroke-width="2" />
</svg>
