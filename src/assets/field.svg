<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="640" height="480">
  <defs>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18" />
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.08" />
    </linearGradient>
  </defs>

  <rect width="640" height="480" fill="#d9a961" />

  <!-- Plank rows. Each row is offset so the seams do not line up. -->
  <g>
    <rect x="0"   y="0"   width="180" height="40" fill="#deb06a" />
    <rect x="180" y="0"   width="220" height="40" fill="#d3a15c" />
    <rect x="400" y="0"   width="140" height="40" fill="#e3b873" />
    <rect x="540" y="0"   width="100" height="40" fill="#d7a660" />

    <rect x="0"   y="40"  width="120" height="40" fill="#d3a15c" />
    <rect x="120" y="40"  width="200" height="40" fill="#e1b571" />
    <rect x="320" y="40"  width="180" height="40" fill="#d8a862" />
    <rect x="500" y="40"  width="140" height="40" fill="#dcae68" />

    <rect x="0"   y="80"  width="240" height="40" fill="#e3b873" />
    <rect x="240" y="80"  width="130" height="40" fill="#d5a45e" />
    <rect x="370" y="80"  width="170" height="40" fill="#dfb26c" />
    <rect x="540" y="80"  width="100" height="40" fill="#d3a15c" />

    <rect x="0"   y="120" width="150" height="40" fill="#d8a862" />
    <rect x="150" y="120" width="190" height="40" fill="#e5ba76" />
    <rect x="340" y="120" width="150" height="40" fill="#d4a25d" />
    <rect x="490" y="120" width="150" height="40" fill="#deb06a" />

    <rect x="0"   y="160" width="200" height="40" fill="#dcae68" />
    <rect x="200" y="160" width="160" height="40" fill="#d2a05b" />
    <rect x="360" y="160" width="200" height="40" fill="#e1b571" />
    <rect x="560" y="160" width="80"  height="40" fill="#d7a660" />

    <rect x="0"   y="200" width="130" height="40" fill="#e3b873" />
    <rect x="130" y="200" width="210" height="40" fill="#d6a55f" />
    <rect x="340" y="200" width="140" height="40" fill="#dfb26c" />
    <rect x="480" y="200" width="160" height="40" fill="#d3a15c" />

    <rect x="0"   y="240" width="170" height="40" fill="#d5a45e" />
    <rect x="170" y="240" width="180" height="40" fill="#e5ba76" />
    <rect x="350" y="240" width="160" height="40" fill="#d8a862" />
    <rect x="510" y="240" width="130" height="40" fill="#deb06a" />

    <rect x="0"   y="280" width="220" height="40" fill="#e1b571" />
    <rect x="220" y="280" width="140" height="40" fill="#d3a15c" />
    <rect x="360" y="280" width="180" height="40" fill="#dcae68" />
    <rect x="540" y="280" width="100" height="40" fill="#e3b873" />

    <rect x="0"   y="320" width="140" height="40" fill="#d7a660" />
    <rect x="140" y="320" width="200" height="40" fill="#dfb26c" />
    <rect x="340" y="320" width="150" height="40" fill="#d4a25d" />
    <rect x="490" y="320" width="150" height="40" fill="#e5ba76" />

    <rect x="0"   y="360" width="190" height="40" fill="#deb06a" />
    <rect x="190" y="360" width="170" height="40" fill="#d6a55f" />
    <rect x="360" y="360" width="140" height="40" fill="#e1b571" />
    <rect x="500" y="360" width="140" height="40" fill="#d8a862" />

    <rect x="0"   y="400" width="160" height="40" fill="#d3a15c" />
    <rect x="160" y="400" width="210" height="40" fill="#e3b873" />
    <rect x="370" y="400" width="130" height="40" fill="#d7a660" />
    <rect x="500" y="400" width="140" height="40" fill="#dcae68" />

    <rect x="0"   y="440" width="230" height="40" fill="#e5ba76" />
    <rect x="230" y="440" width="150" height="40" fill="#d5a45e" />
    <rect x="380" y="440" width="160" height="40" fill="#dfb26c" />
    <rect x="540" y="440" width="100" height="40" fill="#d3a15c" />
  </g>

  <!-- Seams between the rows -->
  <g stroke="#b8894a" stroke-opacity="0.45" stroke-width="1">
    <line x1="0" y1="40"  x2="640" y2="40" />
    <line x1="0" y1="80"  x2="640" y2="80" />
    <line x1="0" y1="120" x2="640" y2="120" />
    <line x1="0" y1="160" x2="640" y2="160" />
    <line x1="0" y1="200" x2="640" y2="200" />
    <line x1="0" y1="240" x2="640" y2="240" />
    <line x1="0" y1="280" x2="640" y2="280" />
    <line x1="0" y1="320" x2="640" y2="320" />
    <line x1="0" y1="360" x2="640" y2="360" />
    <line x1="0" y1="400" x2="640" y2="400" />
    <line x1="0" y1="440" x2="640" y2="440" />
  </g>

  <rect width="640" height="480" fill="url(#sheen)" />
</svg>
